<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bitácora Viveros</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <nav class="sidebar" aria-label="Menú principal">
            <div class="brand">
                <div class="brand-name">Bitácora Viveros</div>
                <div class="brand-sub">Semilla Nueva · Mejoramiento</div>
            </div>
            <div class="nav-links">
                <a href="#/panel" data-route="panel">Panel general</a>
                <a href="#/captura" data-route="captura">Captura en campo</a>
                <a href="#/viveros" data-route="viveros">Viveros</a>
                <a href="#/planes" data-route="planes">Planes</a>
                <a href="#/sync" data-route="sync">Sincronización BMS</a>
            </div>
            <div class="nav-user">
                <div class="nav-user-name" id="usuarioNombre"></div>
                <div class="nav-user-rol" id="usuarioRol"></div>
            </div>
        </nav>
        <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- data.js es el único archivo con datos de ejemplo.
        Cuando se conecte Supabase, se reemplaza por consultas reales -->
    <script src="data.js"></script>
    <script src="app.js"></script>

</html>
